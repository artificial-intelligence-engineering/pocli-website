<div class="call">
  <div class="call-box-top">
    {% if site.data.contact.repo %}
      <div class="call-phone"><strong>GitHub: </strong><a href="https://github.com/{{ site.data.contact.repo }}" target="_blank" rel="noopener">{{ site.data.contact.repo }}</a></div>
    {% endif %}
    {% if site.data.contact.install_cmd %}
      <div class="call-email"><strong>Launch: </strong><code>{{ site.data.contact.install_cmd }}</code></div>
    {% endif %}
  </div>
  {% if include.show_button %}
    <div class="call-box-bottom">
      <a href="{{ site.data.contact.contact_button_link | relative_url }}" class="button">{{ site.data.contact.contact_button_label | default: "Quick Start" }}</a>
    </div>
  {% endif %}
</div>
