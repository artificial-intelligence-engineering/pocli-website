baseurl: ''
url: 'https://artificial-intelligence-engineering.github.io'
permalink: pretty
title: 'POCLI'

logo:
  mobile: "images/logo/pocli-logo.png"
  mobile_height: "84px"
  mobile_width: "84px"
  desktop: "images/logo/pocli-logo.png"
  desktop_height: "144px"
  desktop_width: "144px"

home:
  limit_services: 6

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true
    sort_by: weight

defaults:
  - scope:
      path: ""
    values:
      lang: "en"
  - scope:
      path: "es"
    values:
      lang: "es"
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
      lang: "en"
  - scope:
      path: "_services/es"
      type: "services"
    values:
      layout: "service"
      lang: "es"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"
      lang: "en"
  - scope:
      path: "_team/es"
      type: "team"
    values:
      layout: "team"
      lang: "es"

sass:
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - if-function
    - abs-percent
    - slash-div
    - strict-unary
    - function-units

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - LICENSE.md
  - LICENSE
  - README.md
