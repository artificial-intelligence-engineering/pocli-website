baseurl: '/pocli-website'
url: 'https://artificial-intelligence-engineering.github.io'
permalink: pretty
title: 'POCLI'

logo:
  mobile: "images/logo/pocli-logo.jpg"
  mobile_height: "42px"
  mobile_width: "42px"
  desktop: "images/logo/pocli-logo.jpg"
  desktop_height: "72px"
  desktop_width: "72px"

home:
  limit_services: 6

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true
    sort_by: weight

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"

sass:
  style: compressed

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - LICENSE.md
  - LICENSE
  - README.md
