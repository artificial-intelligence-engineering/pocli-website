---
layout: default
bodyClass: "page-team"
---

<div class="container pb-6 pt-6 pt-md-10 pb-md-10">
  <div class="row justify-content-start">
    <div class="col-12 col-md-8">
      <div class="team team-single">
        {% if page.image %}
        <div class="mb-3">
          <img width="90" height="90" alt="{{ page.title }}" src="{{ page.image | relative_url }}" />
        </div>
        {% endif %}
        <h1 class="title">{{ page.title }}</h1>
        {% if page.jobtitle %}
        <p class="text-muted mb-4"><strong>{{ page.jobtitle }}</strong></p>
        {% endif %}
        <div class="content">{{ content }}</div>
      </div>
    </div>
  </div>
</div>
